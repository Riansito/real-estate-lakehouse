# ==============================================================================
# PROFILES DBT: Configuração de Conexão com o PostgreSQL (Data Warehouse)
# Lê credenciais e parâmetros diretamente das variáveis de ambiente (.env)
# ==============================================================================

dbt_imoveis:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: public
      threads: 4
      sslmode: "{{ env_var('POSTGRES_SSLMODE', 'require') }}"
