version: '3.8'

services:
  # Serviço opcional de PostgreSQL local (apenas caso queira rodar offline sem Neon)
  postgres:
    image: postgres:16-alpine
    container_name: real_estate_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_LOCAL_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate_dw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-real_estate_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
